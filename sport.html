
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Longhorn Athletics | Sport</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f7f4;
      color: #203225;
    }

    header {
      background: #0b3322;
      color: white;
      padding: 18px 6%;
    }

    header a {
      color: #e5b93f;
      text-decoration: none;
      font-weight: bold;
    }

    .hero {
      background: #135b38;
      color: white;
      padding: 55px 20px;
      text-align: center;
    }

    .hero h1 {
      font-size: clamp(32px, 6vw, 56px);
      margin: 0 0 12px;
    }

    .hero p {
      color: #e5b93f;
      font-weight: bold;
    }

    main {
      max-width: 1100px;
      margin: 35px auto;
      padding: 0 20px;
    }

    .card {
      background: white;
      padding: 25px;
      border-radius: 12px;
      border-top: 5px solid #e5b93f;
      margin-bottom: 20px;
      box-shadow: 0 5px 18px #0000000a;
    }

    h2 { color: #0b3322; }

    footer {
      text-align: center;
      padding: 30px;
      color: #56645a;
    }
  </style>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
</head>

<body>
  <header>
    <a href="index.html">← Back to Longhorn Athletics</a>
  </header>

  <section class="hero">
    <h1 id="sport-name">Loading sport...</h1>
    <p>BMHS LONGHORNS • PRIDE • TRADITION • EXCELLENCE</p>
  </section>

  <main>
  
<div class="card">
<h2>Schedule &amp; Scores</h2>
<div id="sport-games">Loading Longhorn games...</div>
</div>
 

    <div class="card">
      <h2>Team Roster</h2>
      <p>Team rosters coming soon.</p>
    </div>

    <div class="card">
      <h2>Player Statistics</h2>
      <p>Player statistics coming soon.</p>
    </div>
  </main>

  <footer>
    Longhorn Athletics | Battle Mountain High School
  </footer>

  <script>
    const SUPABASE_URL =
      "https://zwbjethanfvgqknngcii.supabase.co";

    const SUPABASE_PUBLISHABLE_KEY =
      "sb_publishable_k7rAGIWYj_t_BmDfbwp42w_Yj375UCa";

    const db = window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_PUBLISHABLE_KEY
    );

    async function loadSport() {
      const params = new URLSearchParams(window.location.search);
      const sportId = params.get("id");
      const heading = document.getElementById("sport-name");

      if (!sportId) {
        heading.textContent = "Sport not specified";
        return;
      }

      const { data, error } = await db
        .from("sports")
        .select("name")
        .eq("id", sportId)
        .maybeSingle();

      if (error || !data) {
        heading.textContent = "Sport not found";
        if (error) console.error(error.message);
        return;
      }

      heading.textContent = data.name;
      document.title = data.name + " | Longhorn Athletics";
    }

async function loadSportGames() {
  const params = new URLSearchParams(window.location.search);
  const sportId = params.get("id");
  const gamesList = document.getElementById("sport-games");

  if (!gamesList || !sportId) return;

  const { data, error } = await db
    .from("games")
    .select("opponent, game_date, location, home_away, status, bm_score, opponent_score, teams!inner(name, sport_id)")
    .eq("teams.sport_id", sportId)
    .order("game_date", { ascending: false });

  if (error) {
    gamesList.textContent = "Unable to load schedule.";
    console.error("Sport games error:", error.message);
    return;
  }

  gamesList.replaceChildren();

  if (!data.length) {
    gamesList.textContent = "No games posted yet.";
    return;
  }

  data.forEach(game => {
    const entry = document.createElement("p");
    const date = new Date(game.game_date).toLocaleDateString();

    const score = game.status === "Completed"
      ? `FINAL: BM ${game.bm_score} - ${game.opponent_score} ${game.opponent}`
      : game.status;

    entry.textContent = `${date} • ${game.home_away} vs. ${game.opponent} • ${score}`;
    gamesList.appendChild(entry);
  });
}
loadSportGames();
    loadSport();
  </script>
</body>
</html>
