<body>

<div id="new-game-section" hidden style="margin-top:25px;">

<div id="game-details" hidden style="margin-top:25px;">

<label

>

</label>

<button

</div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>

  <script>
    const SUPABASE_URL =
      "https://zwbjethanfvgqknngcii.supabase.co";

    const SUPABASE_PUBLISHABLE_KEY =
      "sb_publishable_k7rAGIWYj_t_BmDfbwp42w_Yj375UCa";

    const db = window.supabase.createClient(

    async function checkScheduleAccess() {
      const status = document.getElementById("status");
      status.textContent = "Checking administrator access...";

      const { data: { user }, error } =
        await db.auth.getUser();

      if (error || !user) {
        status.textContent =
          "Please sign in to manage schedules.";
        return;
      }

      const { data: isAdmin, error: roleError } =
        await db.rpc("is_super_admin");

      if (roleError || isAdmin !== true) {
        status.textContent =
          "Access denied. Athletic Director permission required.";
        return;
      }

      status.textContent =
        "Access verified! Welcome to Schedule Management.";
      
document.getElementById("schedule-form").hidden = false;
      document.getElementById("new-game-section").hidden = false;
await loadScheduleGames();
    }

async function loadScheduleGames() {
  const dropdown = document.getElementById("game-select");

  dropdown.innerHTML =
    '<option value="">Choose a game...</option>';

  const { data: games, error } = await db
    .from("games")
    .select(`
      id,
      game_date,
      opponent,
      teams (
        name,
        level,
        sports (name)
      )
    `)
    .order("game_date", { ascending: false });

  if (error) {
    console.error("Error loading games:", error);
    document.getElementById("status").textContent =
      "Could not load games: " + error.message;
    return;
  }

  for (const game of games) {
    const option = document.createElement("option");
    option.value = game.id;

    const sport = game.teams?.sports?.name
      || game.teams?.name
      || "Unknown Sport";

    const level = game.teams?.level || "";

    const date = new Date(game.game_date)
      .toLocaleDateString("en-US", {
        timeZone: "America/Los_Angeles",
        month: "short",
        day: "numeric",
        year: "numeric"
      });

    option.textContent =
      `${sport} ${level} | ${date} vs ${game.opponent}`;

    dropdown.appendChild(option);
  }
}

async function showSelectedGame() {
  const gameId = document.getElementById("game-select").value;
  const details = document.getElementById("game-details");
  const message = document.getElementById("edit-message");

  details.hidden = true;
  message.textContent = "";

  if (!gameId) return;

  const { data: game, error } = await db
    .from("games")
    .select("id,opponent,game_date,location,time_tbd")
    .eq("id", gameId)
    .single();

  if (error) {
    message.textContent = "Unable to load game: " + error.message;
    details.hidden = false;
    return;
  }

  const gameDate = new Date(game.game_date);

  const dateParts = new Intl.DateTimeFormat("en-US", {
    timeZone: "America/Los_Angeles",
    year: "numeric",
    month: "2-digit",
    day: "2-digit"
  }).formatToParts(gameDate);

  const part = type =>
    dateParts.find(item => item.type === type)?.value;

  document.getElementById("edit-opponent").value =
    game.opponent || "";

  document.getElementById("edit-date").value =
    `${part("year")}-${part("month")}-${part("day")}`;

  document.getElementById("edit-time").value =
    game.time_tbd
      ? ""
      : new Intl.DateTimeFormat("en-GB", {
          timeZone: "America/Los_Angeles",
          hour: "2-digit",
          minute: "2-digit",
          hourCycle: "h23"
        }).format(gameDate);

const tbdCheckbox = document.getElementById("edit-time-tbd");
const timeInput = document.getElementById("edit-time");

tbdCheckbox.checked = game.time_tbd === true;
timeInput.disabled = tbdCheckbox.checked;

  document.getElementById("edit-location").value =
    game.location || "";

  document.getElementById("selected-game-name").textContent =
    document.getElementById("game-select")
      .selectedOptions[0].textContent;

  details.hidden = false;
}

document.getElementById("game-select")
  .addEventListener("change", showSelectedGame);

function nevadaGameDateToUTC(date, time) {
  const [year, month, day] = date.split("-").map(Number);
  const [hour, minute] = time.split(":").map(Number);

  const localAsUTC = Date.UTC(
    year, month - 1, day, hour, minute
  );

  const formatter = new Intl.DateTimeFormat("en-US", {
    timeZone: "America/Los_Angeles",
    year: "numeric",
    month: "2-digit",
    day: "2-digit",
    hour: "2-digit",
    minute: "2-digit",
    hourCycle: "h23"
  });

  function getOffset(timestamp) {
    const parts = formatter.formatToParts(new Date(timestamp));
    const value = type =>
      Number(parts.find(p => p.type === type).value);

    const displayedAsUTC = Date.UTC(
      value("year"),
      value("month") - 1,
      value("day"),
      value("hour"),
      value("minute")
    );

    return displayedAsUTC - timestamp;
  }

  let timestamp = localAsUTC - getOffset(localAsUTC);
  timestamp = localAsUTC - getOffset(timestamp);

  const result = new Date(timestamp);

  const actualLocal = formatter.formatToParts(result);
  const actual = type =>
    Number(actualLocal.find(p => p.type === type).value);

  if (
    actual("year") !== year ||
    actual("month") !== month ||
    actual("day") !== day ||
    actual("hour") !== hour ||
    actual("minute") !== minute
  ) {
    throw new Error(
      "This local time does not exist due to daylight saving time. Choose another time."
    );
  }

  return result.toISOString();
}

async function saveGameChanges() {
  const gameId = document.getElementById("game-select").value;
  const message = document.getElementById("edit-message");
  const saveButton = document.getElementById("save-game");

  if (!gameId) {
    message.textContent = "Please select a game first.";
    return;
  }

  const opponent = document.getElementById("edit-opponent").value.trim();
  const location = document.getElementById("edit-location").value.trim();

const date = document.getElementById("edit-date").value;
const time = document.getElementById("edit-time").value;
const timeTBD = document.getElementById("edit-time-tbd").checked;

if (!date || (!timeTBD && !time)) {
  message.textContent = "Please enter a game date and time, or mark the time TBD.";
  return;
}

  if (!opponent) {
    message.textContent = "Opponent cannot be empty.";
    return;
  }

  saveButton.disabled = true;
  message.textContent = "Saving changes...";

  try {
  
const gameDateUTC = nevadaGameDateToUTC(
  date,
  timeTBD ? "12:00" : time
);

const { data, error } = await db
  .from("games")
  .update({
    opponent: opponent,
    location: location || null,
    game_date: gameDateUTC,
    time_tbd: timeTBD
  })

      .eq("id", gameId)
      .select("id,opponent,location")
      .single();

    if (error) throw error;

    message.textContent = "Game changes saved successfully!";

    await loadScheduleGames();
    document.getElementById("game-select").value = gameId;

    document.getElementById("selected-game-name").textContent =
      document.getElementById("game-select")
        .selectedOptions[0].textContent;

  } catch (error) {
    message.textContent = "Save failed: " + error.message;
  } finally {
    saveButton.disabled = false;
  }
}

document.getElementById("save-game")
  .addEventListener("click", saveGameChanges);

document.getElementById("edit-time-tbd")
  .addEventListener("change", function () {
    document.getElementById("edit-time").disabled =
      this.checked;
  });

document.getElementById("show-new-game")
  .addEventListener("click", function () {
    const form = document.getElementById("new-game-form");

    form.hidden = !form.hidden;

    this.textContent = form.hidden
      ? "+ Add New Game"
      : "− Close New Game Form";
  });

    checkScheduleAccess();
  </script>
</body>
