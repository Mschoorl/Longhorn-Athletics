
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Manage Schedules | Longhorn Athletics</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f7f4;
      color: #203225;
    }

    header {
      background: #07532f;
      color: white;
      text-align: center;
      padding: 30px 20px;
    }

    header h1 {
      margin-bottom: 8px;
    }

    main {
      max-width: 1000px;
      margin: 35px auto;
      padding: 0 20px;
    }

    .card {
      background: white;
      padding: 25px;
      border-radius: 12px;
      border-top: 5px solid #e9b83f;
      margin-bottom: 20px;
    }

    .button {
      display: inline-block;
      background: #07532f;
      color: white;
      padding: 12px 20px;
      border-radius: 8px;
      text-decoration: none;
      font-weight: bold;
    }
  </style>
</head>

<body>
  <header>
    <h1>Manage Games &amp; Schedules</h1>
    <p>BMHS Longhorn Athletics</p>
  </header>

  <main>
    <p>
      <a href="admin.html" class="button">
        ← Back to Athletic Director Dashboard
      </a>
    </p>

    <div class="card">
      <h2>Schedule Management</h2>
      <p id="status">Page setup in progress.</p>
      
<div id="schedule-form" hidden style="margin-top:25px;">

  <label for="game-select">
    <strong>Select a Game to Manage:</strong>
  </label>

  <select
    id="game-select"
    style="width:100%;padding:12px;margin-top:10px;"
  >
    <option value="">Choose a game...</option>
  </select>

</div>

    </div>

  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>

  <script>
    const SUPABASE_URL =
      "https://zwbjethanfvgqknngcii.supabase.co";

    const SUPABASE_PUBLISHABLE_KEY =
      "sb_publishable_k7rAGIWYj_t_BmDfbwp42w_Yj375UCa";

    const db = window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_PUBLISHABLE_KEY
    );

    async function checkScheduleAccess() {
      const status = document.getElementById("status");
      status.textContent = "Checking administrator access...";

      const { data: { user }, error } =
        await db.auth.getUser();

      if (error || !user) {
        status.textContent =
          "Please sign in to manage schedules.";
        return;
      }

      const { data: isAdmin, error: roleError } =
        await db.rpc("is_super_admin");

      if (roleError || isAdmin !== true) {
        status.textContent =
          "Access denied. Athletic Director permission required.";
        return;
      }

      status.textContent =
        "Access verified! Welcome to Schedule Management.";
    }

    checkScheduleAccess();
  </script>
</body>
</html>
