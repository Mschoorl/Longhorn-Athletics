
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Player Statistics | Longhorn Athletics</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f7f4;
      color: #203225;
    }
    header {
      background: #0b3322;
      color: white;
      padding: 24px;
      text-align: center;
    }
    main {
      max-width: 900px;
      margin: 35px auto;
      padding: 25px;
      background: white;
      border-top: 5px solid #e5b93f;
      border-radius: 12px;
    }
    h2 { color: #0b3322; }
  </style>
</head>
<body>
  <header>
    <h1>LONGHORN ATHLETICS</h1>
    <p>Player Statistics Management</p>
  </header>

  <main>

<h2>Enter Player Statistics</h2>

<label for="gameSelect"><strong>Select Game:</strong></label>

<select id="gameSelect" style="display:block; width:100%; padding:12px; margin-top:10px; margin-bottom:20px;">
  <option value="">Loading games...</option>
</select>

<p id="gameMessage">Choose a game to begin entering statistics.</p>

<div id="playerSection" style="display:none; margin-top:20px;">
  <label for="playerSelect">
    <strong>Select Player:</strong>
  </label>

  <select id="playerSelect"
    style="display:block; width:100%; padding:12px; margin-top:10px;">
    <option value="">-- Select a Player --</option>
  </select>

  <p id="playerMessage">
    Select a player to enter statistics.
  </p>
</div>

<div style="margin-top:25px;">
  <button
    type="button"
    id="saveStatButton"
    disabled
    style="
      background:#0b5132;
      color:white;
      padding:14px 24px;
      border:none;
      border-radius:7px;
      font-size:16px;
      font-weight:bold;
      cursor:pointer;
    "
  >
    Save Statistics
  </button>

  <p id="saveStatMessage"></p>
</div>

<div id="statSection" style="display:none; margin-top:25px;">
  <h3>Player Statistics</h3>

  <label for="statSelect">
    <strong>Select Statistic:</strong>
  </label>

  <select id="statSelect"
    style="display:block; width:100%; padding:12px; margin-top:10px;">
    <option value="">-- Select a Statistic --</option>
  </select>

  <p id="statMessage">
    Select a statistic to enter.
  </p>

<div style="margin-top:20px;">
  <label for="statValue">
    <strong>Enter Statistic Value:</strong>
  </label>

  <input
    type="number"
    id="statValue"
    min="0"
    step="1"
    placeholder="Example: 125"
    style="display:block; width:100%; box-sizing:border-box; padding:12px; margin-top:10px;"
  >

  <p style="color:#666; font-size:14px;">
    Enter the player's total for the selected statistic.
  </p>
</div>

</div>

  </main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
  const SUPABASE_URL =   "https://zwbjethanfvgqknngcii.supabase.co";
  const SUPABASE_KEY = "sb_publishable_k7rAGIWYj_t_BmDfbwp42w_Yj375UCa";

  const db = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );
  
async function checkStaffAccess() {
  const main = document.querySelector("main");

  // Hide the statistics area until access is verified.
  main.style.display = "none";

  const { data: { user }, error: authError } =
    await db.auth.getUser();

  if (authError || !user) {
    window.location.replace("login.html");
    return;
  }

  const { data: staff, error: roleError } = await db
    .from("staff_roles")
    .select("role")
    .eq("user_id", user.id)
    .in("role", ["super_admin", "coach"])
    .maybeSingle();

  if (roleError || !staff) {
    main.textContent =
      "Access denied. Only authorized athletics staff can use this page.";
    main.style.display = "block";
    return;
  }

  main.style.display = "block";
}


async function loadGames() {
  const gameSelect = document.getElementById("gameSelect");
  const gameMessage = document.getElementById("gameMessage");

  const { data: games, error } = await db
    .from("games")
    .select("id, opponent, game_date, teams(name)")
    .order("game_date", { ascending: false });

  if (error) {
    console.error("Error loading games:", error);
    gameSelect.innerHTML =
      '<option value="">Unable to load games</option>';
    gameMessage.textContent = "Error loading games: " + error.message;
    return;
  }

  gameSelect.innerHTML =
    '<option value="">-- Select a Game --</option>';

  if (!games || games.length === 0) {
    gameMessage.textContent = "No games found.";
    return;
  }

  games.forEach(game => {
    const option = document.createElement("option");
    option.value = game.id;

    const teamName = game.teams?.name || "Team";
    const gameDate = new Date(game.game_date)
      .toLocaleDateString("en-US", { timeZone: "America/Los_Angeles" });

    option.textContent =
      `${teamName} vs. ${game.opponent} — ${gameDate}`;

    gameSelect.appendChild(option);
  });

  gameMessage.textContent =
    "Choose a game to begin entering statistics.";
}

async function loadPlayersForGame() {
  const gameSelect = document.getElementById("gameSelect");
  const playerSection = document.getElementById("playerSection");
  const playerSelect = document.getElementById("playerSelect");
  const playerMessage = document.getElementById("playerMessage");

  const gameId = gameSelect.value;

  playerSection.style.display = "none";
  playerSelect.innerHTML =
    '<option value="">-- Select a Player --</option>';

  if (!gameId) return;

  playerSection.style.display = "block";
  playerMessage.textContent = "Loading players...";

  // Find the team associated with this game.
  const { data: game, error: gameError } = await db
    .from("games")
    .select("team_id")
    .eq("id", gameId)
    .single();

  if (gameError || !game) {
    playerMessage.textContent = "Unable to find the game's team.";
    return;
  }

  // Load players from that team's roster.
  const { data: roster, error: rosterError } = await db
    .from("team_rosters")
    .select("athlete_id, jersey_number, athletes(first_name, last_name)")
    .eq("team_id", game.team_id);

  if (rosterError) {
    console.error(rosterError);
    playerMessage.textContent =
      "Unable to load players: " + rosterError.message;
    return;
  }

  if (!roster || roster.length === 0) {
    playerMessage.textContent = "No players found on this roster.";
    return;
  }

  roster.sort((a, b) =>
    Number(a.jersey_number || 0) - Number(b.jersey_number || 0)
  );

  roster.forEach(player => {
    if (!player.athletes) return;

    const option = document.createElement("option");
    option.value = player.athlete_id;
    option.textContent =
      `#${player.jersey_number || "—"} ` +
      `${player.athletes.first_name} ${player.athletes.last_name}`;

    playerSelect.appendChild(option);
  });

  playerMessage.textContent =
    "Select a player to enter statistics.";
}

// Reload the roster whenever a different game is selected.
document.getElementById("gameSelect")
  .addEventListener("change", loadPlayersForGame);

async function loadStatisticsForGame() {
  const gameId = document.getElementById("gameSelect").value;
  const playerId = document.getElementById("playerSelect").value;
  const statSection = document.getElementById("statSection");
  const statSelect = document.getElementById("statSelect");
  const statMessage = document.getElementById("statMessage");

  statSection.style.display = "none";
  statSelect.innerHTML =
    '<option value="">-- Select a Statistic --</option>';

  if (!gameId || !playerId) return;

  statSection.style.display = "block";
  statMessage.textContent = "Loading statistics...";

  // Find the sport associated with the selected game's team.
  const { data: game, error: gameError } = await db
    .from("games")
    .select("teams(sport_id)")
    .eq("id", gameId)
    .single();

  if (gameError || !game?.teams?.sport_id) {
    statMessage.textContent = "Unable to identify this game's sport.";
    return;
  }

  // Load the statistics available for that sport.
  const { data: stats, error: statsError } = await db
    .from("stat_types")
    .select("id, name")
    .eq("sport_id", game.teams.sport_id)
    .order("name");

  if (statsError) {
    console.error(statsError);
    statMessage.textContent =
      "Unable to load statistics: " + statsError.message;
    return;
  }

  if (!stats || stats.length === 0) {
    statMessage.textContent =
      "No statistics have been configured for this sport.";
    return;
  }

  stats.forEach(stat => {
    const option = document.createElement("option");
    option.value = stat.id;
    option.textContent = stat.name;
    statSelect.appendChild(option);
  });

  statMessage.textContent = "Select a statistic to enter.";
}

// Show the correct statistics when a player is selected.
document.getElementById("playerSelect")
  .addEventListener("change", loadStatisticsForGame);

// Hide old statistics whenever the selected game changes.
document.getElementById("gameSelect")
  .addEventListener("change", () => {
    document.getElementById("statSection").style.display = "none";
    document.getElementById("statSelect").value = "";
  });

function validateStatEntry() {
  const gameId = document.getElementById("gameSelect").value;
  const playerId = document.getElementById("playerSelect").value;
  const statId = document.getElementById("statSelect").value;
  const valueField = document.getElementById("statValue");
  const saveButton = document.getElementById("saveStatButton");

  const value = Number(valueField.value);

  const isValid =
    gameId !== "" &&
    playerId !== "" &&
    statId !== "" &&
    valueField.value.trim() !== "" &&
    Number.isFinite(value) &&
    Number.isInteger(value) &&
    value >= 0;

  saveButton.disabled = !isValid;
  saveButton.style.opacity = isValid ? "1" : "0.5";
  saveButton.style.cursor = isValid ? "pointer" : "not-allowed";
}

// Check the fields whenever something changes.
["gameSelect", "playerSelect", "statSelect", "statValue"]
  .forEach(id => {
    document.getElementById(id)
      .addEventListener("change", validateStatEntry);
  });

document.getElementById("statValue")
  .addEventListener("input", validateStatEntry);

// Clear old values when switching games, players, or statistics.
["gameSelect", "playerSelect", "statSelect"]
  .forEach(id => {
    document.getElementById(id)
      .addEventListener("change", () => {
        document.getElementById("statValue").value = "";
        validateStatEntry();
      });
  });

async function savePlayerStatistic() {
  const button = document.getElementById("saveStatButton");
  const message = document.getElementById("saveStatMessage");

  const gameId = Number(document.getElementById("gameSelect").value);
  const athleteId = Number(document.getElementById("playerSelect").value);
  const statTypeId = Number(document.getElementById("statSelect").value);
  const valueText = document.getElementById("statValue").value.trim();
  const value = Number(valueText);

  validateStatEntry();
  if (button.disabled) return;

  if (!Number.isSafeInteger(gameId) ||
      !Number.isSafeInteger(athleteId) ||
      !Number.isSafeInteger(statTypeId) ||
      !Number.isSafeInteger(value) ||
      value < 0) {
    message.textContent = "Please enter valid statistics.";
    return;
  }

  button.disabled = true;
  message.textContent = "Saving statistic...";

  const { error } = await db
    .from("player_stats")
    .upsert(
      {
        game_id: gameId,
        athlete_id: athleteId,
        stat_type_id: statTypeId,
        value: value
      },
      {
        onConflict: "game_id,athlete_id,stat_type_id"
      }
    );

  if (error) {
    console.error("Save error:", error);
    message.textContent = "Unable to save: " + error.message;
  } else {
    message.textContent = "Statistic saved successfully!";
  }

  validateStatEntry();
}

document.getElementById("saveStatButton")
  .addEventListener("click", savePlayerStatistic);

async function initializeStatsPage() {
  await checkStaffAccess();

  if (document.querySelector("main").style.display === "block" &&
      !document.querySelector("main").textContent.includes("Access denied")) {
    await loadGames();
  }
}

initializeStatsPage();


</script>

</body>
</html>
