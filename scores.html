<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Manage Game Scores | Longhorn Athletics</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f7f4;
      color: #203225;
    }

    header {
      background: #07532f;
      color: white;
      padding: 25px;
      text-align: center;
    }

    header h1 {
      margin-bottom: 8px;
    }

    main {
      max-width: 900px;
      margin: 30px auto;
      padding: 0 20px;
    }

    .card {
      background: white;
      padding: 25px;
      border-radius: 12px;
      border-top: 5px solid #e5b93f;
      margin-bottom: 20px;
    }

    a {
      color: #07532f;
    }
  </style>
</head>
<body>

  <header>
    <h1>Game Scores</h1>
    <p>BMHS Longhorn Athletics</p>
  </header>

  <main>
    <p><a href="admin.html">← Back to Athletic Director Dashboard</a></p>

<div class="card">
  <h2>Manage Game Results</h2>

  <p id="status">Checking administrator access...</p>

  <div id="score-form" hidden>
    <label for="game-select"><strong>Select a Game:</strong></label>

    <select id="game-select" style="width:100%;padding:12px;margin-top:10px;">
      <option value="">Choose a game...</option>
    </select>
 <div id="score-fields" hidden style="margin-top:25px;">
  <h3>Enter Final Score</h3>

  <label for="bm-score"><strong>Battle Mountain Score:</strong></label>
  <input type="number" id="bm-score" min="0" step="1"
    placeholder="Longhorns score"
    style="width:100%;padding:12px;margin:10px 0 20px;">

  <label for="opponent-score"><strong>Opponent Score:</strong></label>
  <input type="number" id="opponent-score" min="0" step="1"
    placeholder="Opponent score"
    style="width:100%;padding:12px;margin:10px 0 20px;">

  <button type="button" id="save-score"
    style="background:#07532f;color:white;padding:14px 24px;border:0;border-radius:8px;cursor:pointer;">
    Save Final Score
  </button>

  <p id="score-message" role="status"></p>
</div>
  </div>
</div>
  </main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>

<script>
  const SUPABASE_URL = "https://zwbjethanfvgqknngcii.supabase.co";

  const SUPABASE_PUBLISHABLE_KEY =
    "sb_publishable_k7rAGIWYj_t_BmDfbwp42w_Yj375UCa";

  const db = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_PUBLISHABLE_KEY
  );
let scoreGames = [];
  async function checkScoreAccess() {
    const status = document.getElementById("status");

    const { data: { user }, error } = await db.auth.getUser();

    if (error || !user) {
      status.textContent = "Please sign in to access game scores.";
      return;
    }

 const { data: isAdmin, error: roleError } = await db.rpc("is_super_admin");

if (roleError || isAdmin !== true) {
  status.textContent = "Access denied. Athletic Director permission required.";
  return;
}

status.textContent = "Access verified! Welcome to Game Scores.";
    document.getElementById("score-form").hidden = false;
await loadScoreGames();
  }
async function loadScoreGames() {
  const gameSelect = document.getElementById("game-select");

  gameSelect.innerHTML = '<option value="">Choose a game...</option>';

  const { data, error } = await db
    .from("games")
    .select(`
      id,
      game_date,
      opponent,
    status,
bm_score,
opponent_score,
teams (
        name,
        level,
        sports (
          name
        )
      )
    `)
    .order("game_date", { ascending: false });

  if (error) {
    console.error("Error loading games:", error);
    gameSelect.innerHTML =
      '<option value="">Unable to load games</option>';
    return;
  }
scoreGames = data || [];
  data.forEach(game => {
    const sport = game.teams?.sports?.name || "Unknown Sport";
    const level = game.teams?.level || "Varsity";

    const date = new Date(game.game_date).toLocaleDateString("en-US", {
      timeZone: "America/Los_Angeles",
      month: "short",
      day: "numeric",
      year: "numeric"
    });

    const option = document.createElement("option");
    option.value = game.id;
    option.textContent =
      `${sport} | ${level} | ${date} | vs. ${game.opponent}`;

    gameSelect.appendChild(option);
  });
}
  document.getElementById("game-select").addEventListener("change", function () {
  const scoreFields = document.getElementById("score-fields");
  const bmScore = document.getElementById("bm-score");
  const opponentScore = document.getElementById("opponent-score");
  const message = document.getElementById("score-message");

  scoreFields.hidden = !this.value;

const selectedGame = scoreGames.find(
  game => String(game.id) === this.value
);

bmScore.value = selectedGame?.bm_score ?? "";
opponentScore.value = selectedGame?.opponent_score ?? "";
message.textContent = "";
});
  document.getElementById("save-score").addEventListener("click", async function () {
  const gameId = document.getElementById("game-select").value;
  const bmScore = document.getElementById("bm-score").value;
  const opponentScore = document.getElementById("opponent-score").value;
  const message = document.getElementById("score-message");

  if (!gameId || bmScore === "" || opponentScore === "") {
    message.textContent = "Please select a game and enter both scores.";
    return;
  }

const finalBmScore = Number(bmScore);
const finalOpponentScore = Number(opponentScore);

if (
  !Number.isSafeInteger(finalBmScore) ||
  !Number.isSafeInteger(finalOpponentScore) ||
  finalBmScore < 0 ||
  finalOpponentScore < 0
) {
  message.textContent = "Please enter valid, nonnegative whole-number scores.";
  return;
}

const saveButton = document.getElementById("save-score");
saveButton.disabled = true;
message.textContent = "Saving final score...";

try {
  const { data, error } = await db
    .from("games")
    .update({
      bm_score: finalBmScore,
      opponent_score: finalOpponentScore,
      status: "Completed"
    })
    .eq("id", gameId)
    .select("id, bm_score, opponent_score, status");

  if (error) throw error;

  if (!data || data.length !== 1) {
    throw new Error("Score was not updated. Check administrator permissions.");
  }

  const savedGame = scoreGames.find(
    game => String(game.id) === String(gameId)
  );

  if (savedGame) {
    savedGame.bm_score = finalBmScore;
    savedGame.opponent_score = finalOpponentScore;
    savedGame.status = "Completed";
  }

  message.textContent = "Final score saved successfully!";
} catch (error) {
  console.error("Score save error:", error);
  message.textContent = "Unable to save score: " + error.message;
} finally {
  saveButton.disabled = false;
}
});
  checkScoreAccess();
</script>
</body>
</html>
