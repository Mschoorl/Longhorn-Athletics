<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Manage Game Scores | Longhorn Athletics</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f7f4;
      color: #203225;
    }

    header {
      background: #07532f;
      color: white;
      padding: 25px;
      text-align: center;
    }

    header h1 {
      margin-bottom: 8px;
    }

    main {
      max-width: 900px;
      margin: 30px auto;
      padding: 0 20px;
    }

    .card {
      background: white;
      padding: 25px;
      border-radius: 12px;
      border-top: 5px solid #e5b93f;
      margin-bottom: 20px;
    }

    a {
      color: #07532f;
    }
  </style>
</head>
<body>

  <header>
    <h1>Game Scores</h1>
    <p>BMHS Longhorn Athletics</p>
  </header>

  <main>
    <p><a href="admin.html">← Back to Athletic Director Dashboard</a></p>

    <div class="card">
      <h2>Manage Game Results</h2>
      <p id="status">Score entry setup in progress.</p>
    </div>
  </main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>

<script>
  const SUPABASE_URL = "https://zwbjethanfvgqknngcii.supabase.co";

  const SUPABASE_PUBLISHABLE_KEY =
    "sb_publishable_k7rAGIWYj_t_BmDfbwp42w_Yj375UCa";

  const db = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_PUBLISHABLE_KEY
  );

  async function checkScoreAccess() {
    const status = document.getElementById("status");

    const { data: { user }, error } = await db.auth.getUser();

    if (error || !user) {
      status.textContent = "Please sign in to access game scores.";
      return;
    }

    status.textContent = "Signed in. Checking score-entry permissions...";
  }

  checkScoreAccess();
</script>
</body>
</html>
